name: CI/CD Pipeline

# Trigger the workflow on every to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-and-push:
    # Run the job on a fresh Ubuntu server provided by GitHub
    runs-on: ubuntu-latest

    environment:
      name: production

    # Grant permissions for the job to write to the GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # ----- CI PHASE -----
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker
          install: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # Use GHA cache to speed up builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- DEPLOY PHASE -----
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          timeout: 1000s
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # We pass these secrets as env vars into the script for safety
          envs: IMAGE_NAME
          script: |
            set -e # Stop script immediately on error
            
            # 1. Setup Directory
            PROJECT_DIR="go-auth"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Initializing repository..."
              git clone https://${{ github.actor }}:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi
            cd $PROJECT_DIR
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Setup Environment Variables
            echo "Creating .env file..."
            cat <<EOF > .env
            PORT=${{ secrets.PORT }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            BASE_URL=${{ secrets.BASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            EOF
            
            # 3. GeoIP Check
            mkdir -p ./pkg/geoip
            if [ ! -f "./pkg/geoip/GeoLite2-City.mmdb" ]; then
              echo "⬇️ Downloading GeoIP database..."
              curl -L "${{ secrets.GEOIP_DOWNLOAD_URL }}" -o geoip.tar.gz
              tar -xzf geoip.tar.gz -C ./pkg/geoip
              rm geoip.tar.gz
            fi
            
            # 4. Pull Latest Images
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose pull nginx
            
            # 5. SSL BOOTSTRAP (The Critical Fix)
            # We must ensure a certificate exists BEFORE starting Nginx, otherwise Nginx crashes.
            mkdir -p ./nginx/certs/live/${{ secrets.DOMAIN_NAME }}
            mkdir -p ./nginx/certbot-webroot
            
            if [ ! -f "./nginx/certs/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem" ]; then
              echo "⚠️  No SSL certificate found. Generating DUMMY certificate to allow Nginx start..."
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout ./nginx/certs/live/${{ secrets.DOMAIN_NAME }}/privkey.pem \
                -out ./nginx/certs/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem \
                -subj "/CN=localhost"
            fi
            
            # 6. Restart Services
            echo "🚀 Restarting services..."
            docker compose down --remove-orphans
            docker compose up -d db redis
            
            # Wait for DB (simple sleep is often more reliable than complex loops in SSH)
            sleep 10 
            
            # Run Migrations
            echo "⚙️ Running Migrations..."
            docker compose run --rm migrate
            
            # Start App and Nginx
            docker compose up -d app nginx certbot
            
            # 7. REAL CERTIFICATE ACQUISITION
            # If the current cert is the dummy one (or missing), we get the real one.
            # We check if the issuer is NOT Let's Encrypt to detect our dummy cert.
            IS_DUMMY=$(openssl x509 -in ./nginx/certs/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem -issuer -noout | grep "Let's Encrypt" || true)
            
            if [ -z "$IS_DUMMY" ]; then
              echo "🔒 Detected Dummy Certificate. Requesting Real Let's Encrypt Certificate..."
            
              # Force renewal using webroot
              docker compose run --rm certbot certonly --webroot --webroot-path /var/www/certbot \
                --email ${{ secrets.SSL_EMAIL }} --agree-tos --no-eff-email --force-renewal \
                -d ${{ secrets.DOMAIN_NAME }} -d www.${{ secrets.DOMAIN_NAME }}
            
              echo "✅ Real certificate obtained. Reloading Nginx..."
              docker compose exec nginx nginx -s reload
            else
              echo "✅ Valid Let's Encrypt certificate already exists."
            fi
            
            echo "🎉 Deployment Success!"