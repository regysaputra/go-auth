name: CI/CD Pipeline

# Trigger the workflow on every to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-and-push:
    # Run the job on a fresh Ubuntu server provided by GitHub
    runs-on: ubuntu-latest
    environment:
      name: production
    # Grant permissions for the job to write to the GitHub Container Registry
    permissions:
      contents: read
      packages: write
    steps:
      # ----- CI PHASE -----
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # Cache Go modules
      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-
      - name: Download Go Modules
        run: go mod download

      - name: Vendor dependencies
        run: go mod vendor

      - name: Run Go Tests
        run: go test ./...

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('.golangci.yml') }}
          restore-keys: |
            golangci-lint-

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0

      # ----- BUILD & PUSH -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:build-cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:build-cache,mode=max

      # Cache GeoIP database
      - name: Cache GeoIP database
        id: cache-geoip
        uses: actions/cache@v4
        with:
          path: pkg/geoip/*.mmdb
          key: geoip-db-${{ hashFiles('setup-geoip.sh') }}
          restore-keys: |
            geoip-db-
            
      # Download GeoIP database if not cached
      - name: Download GeoIP database
        if: steps.cache-geoip.outputs.cache-hit != 'true'
        env:
          GEOIP_DOWNLOAD_URL: ${{ secrets.GEOIP_DOWNLOAD_URL }}
        run: |
          chmod +x setup-geoip.sh
          ./setup-geoip.sh

        # Verify GeoIP database exists
      - name: Verify GeoIP database
        run: |
          echo "Checking for GeoIP databases..."
          if [ -f pkg/geoip/GeoLite2-City.mmdb ]; then
            echo "✅ GeoLite2-City.mmdb found"
            ls -lh pkg/geoip/GeoLite2-City.mmdb
          else
            echo "⚠️ GeoLite2-City.mmdb not found"
          fi
          if [ -f pkg/geoip/GeoLite2-ASN.mmdb ]; then
            echo "✅ GeoLite2-ASN.mmdb found"
            ls -lh pkg/geoip/GeoLite2-ASN.mmdb
          else
            echo "⚠️ GeoLite2-ASN.mmdb not found"
          fi

      # ----- DEPLOY -----
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          timeout: 180s
          host: ${{ secrets.SERVER_HOST }}     # e.g., '123.45.67.89'
          username: ${{ secrets.SERVER_USER }} # e.g., 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Your server's private SSH key
          script: |
            set -ex
            cd go-auth
            
            echo "🔄 Resetting local changes..."
            git reset --hard HEAD
            
            echo "🔄 Pulling latest configuration..."
            git pull origin main
            
            echo "🔐 Logging in to GHCR..."
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Setting up environment variable ..."
            export PORT=8080
            export SECRET_KEY=${{ secrets.SECRET_KEY }}
            export DATABASE_URL=${{ secrets.DATABASE_URL }}
            export SMTP_HOST=${{ secrets.SMTP_HOST }}
            export SMTP_PORT=${{ secrets.SMTP_PORT }}
            export SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            export SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            export SMTP_FROM=${{ secrets.SMTP_FROM }}
            export BASE_URL=${{ secrets.BASE_URL }}
            export REDIS_URL=${{ secrets.REDIS_URL }}
            
            echo "⬇️ Pulling all new images defined in compose file..."
            docker compose pull
            
            echo "⚙️ Running database migrations..."
            docker compose run --rm migrate || echo "Migration skipped or already applied"
            
            echo "🚀 Restarting the application container..."
            docker compose up -d api
            
            echo "Cleaning up old images..."
            docker image prune -f
