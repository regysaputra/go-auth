name: CI/CD Pipeline

# Trigger the workflow on every to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-and-push:
    # Run the job on a fresh Ubuntu server provided by GitHub
    runs-on: ubuntu-latest

    environment:
      name: production

    # Grant permissions for the job to write to the GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # ----- CI PHASE -----
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Download Go Modules
        run: go mod download

      - name: Vendor dependencies
        run: go mod vendor

      - name: Run Go Tests
        run: go test ./...

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0

      # ----- BUILD & PUSH -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- DEPLOY -----
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          timeout: 1000s
          host: ${{ secrets.SERVER_HOST }}     # e.g., '123.45.67.89'
          username: ${{ secrets.SERVER_USER }} # e.g., 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Your server's private SSH key
          script: |
            set -e # Stop script immediately on error

            # 1. Setup Directory
            if [ ! -d "go-auth/.git" ]; then
              echo "Repository not found or not a git repo — cloning fresh copy..."
              sudo rm -rf go-auth
              # If your repo is public:
              git clone https://github.com/regysaputra/go-auth.git
              # If private, use a token (ensure TOKEN_GITHUB is set as secret)
              # git clone https://$GITHUB_ACTOR:$TOKEN_GITHUB@github.com/regysaputra/go-auth.git
            fi
            cd go-auth
            git fetch origin main
            git reset --hard origin/main

            # 2. Setup Environment Variables
            echo "Creating .env file..."
            cat <<EOF > .env
            PORT=${{ secrets.PORT }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            BASE_URL=${{ secrets.BASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            EOF

            # 3. GeoIP Check
            if [ ! -f "./pkg/geoip/GeoLite2-City.mmdb" ]; then
              echo "⬇️ Downloading GeoIP database..."
              curl -L "${{ secrets.GEOIP_DOWNLOAD_URL }}" -o geoip.tar.gz
              tar -xzf geoip.tar.gz
              rm geoip.tar.gz
            fi

            # 4. Pull Latest Images
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose pull nginx

            # 6. Restart Services
            echo "🚀 Restarting services..."
            docker compose down --remove-orphans
            docker compose up -d db redis

            # Wait for DB (simple sleep is often more reliable than complex loops in SSH)
            sleep 10 

            # Run Migrations
            echo "⚙️ Running Migrations..."
            docker compose run --rm migrate

            # Start App and Nginx
            docker compose up -d app nginx certbot

            echo "🎉 Deployment Success!"