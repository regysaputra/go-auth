name: CI/CD Pipeline

# Trigger the workflow on every to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-and-push:
    # Run the job on a fresh Ubuntu server provided by GitHub
    runs-on: ubuntu-latest

    environment:
      name: production


    # Grant permissions for the job to write to the GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # ----- CI PHASE -----
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Download Go Modules
        run: go mod download

      - name: Vendor dependencies
        run: go mod vendor

      - name: Run Go Tests
        run: go test ./...

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0

      # ----- BUILD & PUSH -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- DEPLOY -----
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          timeout: 1000s
          host: ${{ secrets.SERVER_HOST }}     # e.g., '123.45.67.89'
          username: ${{ secrets.SERVER_USER }} # e.g., 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Your server's private SSH key
          script: |
            set -ex
            # if repo missing or not a git repo, clone a fresh copy
            if [ ! -d "go-auth/.git" ]; then
              echo "Repository not found or not a git repo — cloning fresh copy..."
              rm -rf go-auth
              # If your repo is public:
              git clone https://github.com/regysaputra/go-auth.git
              # If private, use a token (ensure TOKEN_GITHUB is set as secret)
              # git clone https://$GITHUB_ACTOR:$TOKEN_GITHUB@github.com/regysaputra/go-auth.git
            fi
            cd go-auth
            
            echo "🔄 Resetting local changes..."
            git reset --hard HEAD
            
            echo "🔄 Pulling latest configuration..."
            git pull origin main
            
            echo "📁 Checking if GeoLite2-City.mmdb exists..."
            if [ ! -f "./pkg/geoip/GeoLite2-City.mmdb" ]; then
              echo "⬇️ GeoIP database missing. Downloading .tar.gz from Dropbox..."
              curl -L "${{ secrets.GEOIP_DOWNLOAD_URL }}" -o geoip.tar.gz
              
              echo "📦 Extracting..."
              tar -xzf geoip.tar.gz
              
              echo "🧹 Removing archive..."
              rm geoip.tar.gz
            else
              echo "✔️ GeoIP database already exists — skipping download."
            fi
            
            if [ -d "./nginx/certs" ]; then
              echo "./nginx/certs is exixts"
            else
              echo "./nginx/certs does not exixts. Create SSL directory"
              mkdir -p nginx/certs
            fi
            
            if [ -d "./nginx/certbot-webroot" ]; then
              echo "./nginx/certbot-webroot is exixts"
            else
              echo "./nginx/certbot-webroot does not exixts. Create SSL directory"
              mkdir -p nginx/certbot-webroot
            fi
            
            echo "🔐 Logging in to GHCR..."
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "⬇️ Pulling latest image..."
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            echo "Setting up environment variable ..." 
            echo -e "PORT=${{ secrets.PORT }}\nSECRET_KEY=${{ secrets.SECRET_KEY }}\nDATABASE_URL=${{ secrets.DATABASE_URL }}\nSMTP_HOST=${{ secrets.SMTP_HOST }}\nSMTP_PORT=${{ secrets.SMTP_PORT }}\nSMTP_USERNAME=${{ secrets.SMTP_USERNAME }}\nSMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}\nSMTP_FROM=${{ secrets.SMTP_FROM }}\nBASE_URL=${{ secrets.BASE_URL }}\nREDIS_URL=${{ secrets.REDIS_URL }}" > .env
            
            echo "🧹 Stopping old containers..."
            docker compose down
            
            echo "Cleaning up old volumes and images..."
            docker system prune -f
            
            echo "⬇️ Pulling Redis and PostgreSQL images..."
            docker pull redis:alpine
            docker pull postgres:17-alpine
            
            echo "🧩 Starting dependencies..."
            docker compose up -d db redis

            echo "⏳ Waiting for PostgreSQL..."
            timeout 60 bash -c '
              until docker exec db pg_isready -U regy -d auth; do
                sleep 2
              done
            '
            echo "✅ PostgreSQL is ready"

            echo "⏳ Waiting for Redis..."
            timeout 60 bash -c '
              until docker exec redis redis-cli ping | grep -q PONG; do
                sleep 2
              done
            '
            echo "✅ Redis is ready"

            echo "🚀 Starting application..."
            docker compose up -d app
            
            echo "Running nginx reverse proxy..."
            docker compose up -d nginx
            
            # Check if SSL certificate exists
            echo "🔍 Checking SSL certificate status..."
            if [ ! -d "./nginx/certs/live/${{ secrets.DOMAIN_NAME }}" ]; then
              echo "🔒 SSL certificate not found. Obtaining from Let's Encrypt..."
            
              # Wait for nginx to be fully ready
              sleep 3
            
              # Obtain SSL certificate
              docker compose run --rm certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                --email ${{ secrets.SSL_EMAIL }} \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                -d ${{ secrets.DOMAIN_NAME }} \
                -d www.${{ secrets.DOMAIN_NAME }} || echo "⚠️ Certificate generation failed. Manual intervention may be required."
            
              # Reload nginx to use the new certificate
              if [ -d "./nginx/certs/live/${{ secrets.DOMAIN_NAME }}" ]; then
                echo "✅ Certificate obtained successfully. Reloading nginx..."
                docker compose exec nginx nginx -s reload
              fi
            else
              echo "✅ SSL certificate already exists"
            fi
            
            # Start certbot for auto-renewal
            echo "🔄 Starting certbot for auto-renewal..."
            docker compose up -d certbot
            
            echo "⚙️ Running database migrations..."
            # ✅ Ensures migrate binary is called correctly
            docker compose run --rm migrate || echo "Migration skipped or already applied"
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Your application should be available at https://${{ secrets.BASE_URL }}"