name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: go-auth-api
  GHCR_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "IMAGE_TAG=$(echo ${GITHUB_SHA} | cut -c1-12)" >> $GITHUB_OUTPUT

      - name: Set up QEMU and buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_BASE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.GHCR_BASE }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GITHUB_OWNER=${{ github.repository_owner }}

  deploy:
    name: SSH Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          timeout: 600s
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/go-auth || true
            # Make sure we match remote main
            git fetch origin main
            git reset --hard origin/main

            # Ensure geoip directory exists
            echo "📁 Ensuring ./pkg/geoip exists..."
            mkdir -p ./pkg/geoip
            chmod 755 ./pkg/geoip

            # Download & extract GeoIP only if mmdb missing
            if [ ! -f "./pkg/geoip/GeoLite2-City.mmdb" ]; then
              echo "⬇️ GeoIP database missing - downloading..."
              # avoid leaking secrets in logs
              set +x
              curl -L "${{ secrets.GEOIP_DROPBOX_URL }}" -o geoip.tar.gz
              set -x
              tar -xzf geoip.tar.gz -C ./pkg/geoip
              rm geoip.tar.gz
              echo "✔ GeoIP extracted."
            else
              echo "✔ GeoIP already present - skipping download."
            fi

            # Create .env (write safely) so docker compose can use it.
            echo "🔒 Writing .env from secrets (not printed)..."
            set +x
            cat > .env <<EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            BASE_URL=${{ secrets.BASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOF
            set -x
  
            echo "🔐 Logging in to GHCR (server) so docker compose can pull images..."
            echo ${{ secrets.TOKEN_GITHUB }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Export IMAGE_TAG from the workflow output (12-char commit id)
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            
            echo "⬇️ Pulling composed images (using tag ${IMAGE_TAG})..."
            # Pull the specific pushed image tags (so compose uses the correct image)
            docker compose pull || true
            
            echo "⚙️ Running database migrations..."
            # This runs the built migrate binary inside a container; tolerates no-op
            docker compose run --rm migrate || echo "Migration container returned non-zero (check logs)"
            
            echo "🚀 Starting / restarting API container..."
            docker compose up -d api
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
