services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    expose:
      - "8080"
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=${BASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./public:/app/public:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network  # ✅ Has network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    entrypoint: ["/usr/local/bin/redis-server"]
    command: ["--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network  # ✅ Has network

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: regy
      POSTGRES_DB: auth
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regy -d auth"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - app-network  # ← ADD THIS!

  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/infrastructure/db/migrations:/migrations
      - ./migrate.sh:/migrate.sh:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network  # ← ADD THIS!

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-network

volumes:
  pg-data:
  redis-data:

networks:
  app-network:
    driver: bridge