version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/${GITHUB_OWNER:-your-org}/go-auth-api:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=${BASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - db
      - redis
    volumes:
      # Host folder holds GeoIP files (created on server by deploy script)
      - ./pkg/geoip:/app/pkg/geoip:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- --timeout=2 http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-your-org}/go-auth-migrate:${IMAGE_TAG:-latest}
    entrypoint: ["/app/migrate"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./pkg/geoip:/app/pkg/geoip:ro
    depends_on:
      - db
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-regy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - db-data:/var/lib/postgresql/data
    # DO NOT expose postgres to the public internet unless you need it.
    # ports: ["5432:5432"]  # commented out intentionally
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
