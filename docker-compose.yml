services:
  app:
    image: ghcr.io/regysaputra/go-auth:latest
    container_name: app
    expose:
      - "8080"
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=${BASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    entrypoint: [ "/usr/local/bin/redis-server" ]
    command: [ "--appendonly", "yes" ]
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: regy
      POSTGRES_DB: auth
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U regy -d auth" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/infrastructure/db/migrations:/migrations
    profiles:
      - tools
    entrypoint: ["/usr/local/bin/migrate"]
    command: [
      "-path", "/migrations",
      "-database", "postgres://regy:123@db:5432/auth?sslmode=disable",
      "up"
    ]
    networks:
      - app-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: nginx    # optional — remove for portability
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
#      - ./static:/usr/share/nginx/html:ro
#      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
#      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  pg-data:
  redis-data:

networks:
  app-network:
    driver: bridge