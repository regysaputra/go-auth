services:
  app:
    image: ghcr.io/regysaputra/go-auth:latest
    container_name: app
    expose:
      - "8080"
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=${BASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - db
      - redis
    networks:
      - app-network
    volumes:
      - ./pkg/geoip:/app/pkg/geoip:ro
      - ./templates:/app/templates:ro
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    entrypoint: [ "/usr/local/bin/redis-server" ]
    command: [ "--appendonly", "yes" ]
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: regy
      POSTGRES_DB: auth
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5433:5432"

  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/infrastructure/db/migrations:/migrations
    entrypoint: ["/usr/local/bin/migrate"]
    command: [
      "-path", "/migrations",
      "-database", "postgres://regy:123@db:5432/auth?sslmode=disable",
      "up"
    ]
    networks:
      - app-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine  # Alpine version is smaller
    container_name: nginx
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (for future use)
    volumes:
      # Mount configuration files
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/default.conf:ro

      # Mount SSL certificates (optional, for HTTPS)
      # - ./nginx/ssl:/etc/nginx/ssl:ro

      # Mount logs for debugging
#      - ./nginx/logs:/var/log/nginx

      # Mount static files if needed
      # - ./public:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
#    healthcheck:
#      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
#      interval: 10s
#      timeout: 5s
#      retries: 3

volumes:
  pg-data:
  redis-data:

networks:
  app-network:
    driver: bridge