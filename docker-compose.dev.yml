services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app
    expose:
      - "8080"
    environment:
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://regy:123@db:5432/auth?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - BASE_URL=https://localhost
      - GO_ENV=development
    volumes:
      - .:/app
      - /app/tmp          # Exclude tmp directory from mount
      - /app/vendor       # Exclude vendor directory from mount
      - ./pkg/geoip:/app/pkg/geoip:ro
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: regy
      POSTGRES_DB: auth
    volumes:
      - pg-data-dev:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  # Expose for local development tools
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regy -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    volumes:
      - ./internal/infrastructure/db/migrations:/migrations
    environment:
      - DATABASE_URL=postgres://regy:123@db:5432/auth?sslmode=disable
    entrypoint: sh
    command: -c "migrate -path /migrations -database $DATABASE_URL up"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # For local HTTPS with mkcert
      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - app
    networks:
      - app-network

#  certbot:
#    image: certbot/certbot
#    container_name: certbot-dev
#    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
#      # For local HTTPS with mkcert
#      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
#      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
#    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
#    depends_on:
#      - app
#    networks:
#      - app-network

  # Optional: Database GUI for development
  adminer:
    image: adminer
    container_name: adminer-dev
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - app-network

volumes:
  pg-data-dev:
  redis-data-dev:

networks:
  app-network:
    driver: bridge